<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Davies Visual Media</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo-wrapper">
                <img src="https://placehold.co/100x100/6366f1/FFF?text=DVM" alt="Davies Visual Media Logo" class="nav-logo" id="siteLogo">
                <span class="logo-text">Davies Visual Media</span>
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <p>Join Davies Visual Media to manage your design projects.</p>
            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" required minlength="2">
                    <div class="validation-msg" id="nameMsg"></div>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" required>
                    <div class="validation-msg" id="emailMsg"></div>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required minlength="6">
                    <div class="validation-msg" id="passwordMsg"></div>
                </div>
                <div class="form-group">
                    <label for="signupRole">Account Type</label>
                    <select id="signupRole" required>
                        <option value="customer">Customer / Client</option>
                        <option value="admin">Admin / Staff</option>
                    </select>
                </div>
                <div class="validation-msg error" id="formError" style="margin-bottom: 15px; text-align: center;"></div>
                <button type="submit" class="btn-primary auth-btn" id="signupBtn">Create Account</button>
            </form>
            <div class="auth-link">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
